name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build & test (host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run test suite
        run: make run

  misra:
    name: MISRA-C:2012 static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version

      - name: Run MISRA-C:2012 scan
        # Scoped to src/eeprom.c only: eeprom.h is declarations-only, and
        # test/test_eeprom.c is explicitly host-only test code, not part
        # of the shipped library (see its own file header comment).
        #
        # --enable=all is required, not cosmetic: without it the misra
        # addon produces zero misra-c2012-* findings at all with this
        # cppcheck build (verified locally) - it also enables cppcheck's
        # own native checks (e.g. unusedFunction), which are irrelevant to
        # MISRA compliance and are deliberately NOT part of the pass/fail
        # gate below (see the grep step).
        #
        # cppcheck-suppressions.txt lists only the specific, documented
        # deviations recorded in IMPLEMENTATION_NOTES.md (MISRA-C:2012
        # Deviation Record) - anything cppcheck reports as misra-c2012-*
        # that ISN'T in that file survives to the grep check below and
        # fails this job. Given this codebase currently has zero
        # Required/Mandatory MISRA violations (see that section), any
        # unsuppressed misra-c2012-* finding is either a Required/Mandatory
        # violation or a newly-introduced, not-yet-reviewed Advisory one -
        # either way, it needs a human to look at it before merging, not a
        # silent pass.
        run: |
          set -o pipefail
          cppcheck --addon=misra --enable=all --inconclusive -I inc \
            --suppressions-list=cppcheck-suppressions.txt \
            src/eeprom.c 2>&1 | tee cppcheck-output.txt

          # Exclude [unmatchedSuppression] "information:" notices before
          # the misra-c2012- grep below. Investigated, not assumed: this
          # runner's cppcheck reports "Unmatched suppression:
          # misra-c2012-8.7" for a suppression entry that is, in fact,
          # correct and still needed - it hides a genuine Rule 8.7 finding
          # on this library's 7 public API functions (external linkage,
          # only referenced outside this translation unit - see
          # IMPLEMENTATION_NOTES.md's MISRA-C:2012 Deviation Record).
          # Confirmed locally, with two different cppcheck builds: the 7
          # flagged functions are unchanged, and the same suppression file
          # correctly matches and hides all 7 findings with no complaint.
          # The "Unmatched suppression" wording is an addon-vs-native
          # suppression-bookkeeping quirk specific to this runner's
          # cppcheck build, not a real finding - and since that message
          # still contains the substring "misra-c2012-8.7", the old plain
          # grep failed the build on an informational notice about the
          # suppression mechanism itself, not on any code violation.
          if grep "misra-c2012-" cppcheck-output.txt | grep -v "unmatchedSuppression" | grep -q .; then
            echo "::error::Unsuppressed MISRA-C:2012 finding(s) - not in cppcheck-suppressions.txt. See IMPLEMENTATION_NOTES.md (MISRA-C:2012 Deviation Record) to review and either fix the code or document a new deviation."
            exit 1
          fi

          echo "No unsuppressed MISRA-C:2012 findings."
